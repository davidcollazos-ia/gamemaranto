<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topos del Pinar</title>
<style>
:root{--ink:#18352b;--cream:#fff7df;--coral:#e8664f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;color:var(--ink);background:#b4dba4}button{font:inherit;font-weight:900;cursor:pointer;border:3px solid var(--ink);border-radius:13px;transition:.15s}button:hover{transform:translateY(-2px);filter:brightness(1.06)}.page{min-height:100vh;padding:22px 15px 36px;background:linear-gradient(#9bd4df 0 24%,#b9dfa0 54%,#619653 100%)}.shell{max-width:1050px;margin:auto}.brand{display:flex;align-items:center;gap:12px;color:#fff8dd;text-shadow:3px 4px #28533e;margin-bottom:16px}.brand b{font-size:clamp(2rem,6vw,4rem);line-height:.85;letter-spacing:-.08em}.brand span{font-weight:900;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}.card{background:var(--cream);border:4px solid var(--ink);border-radius:25px;box-shadow:0 10px 0 #204b39;overflow:hidden}.intro{text-align:center;padding:26px}.intro h2{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.7rem)}.intro p{margin:0;opacity:.7;font-weight:700}.gallery{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;padding:0 16px 18px;max-height:none;overflow:visible}.person{position:relative;aspect-ratio:1/1.12;border:2px solid #b9a46f;border-radius:9px;overflow:hidden;background:#d8c58e;padding:0;min-width:0}.person img{width:100%;height:100%;object-fit:cover;object-position:center top}.person.selected{border-color:var(--coral);box-shadow:0 0 0 3px #e8664f66}.person.selected:after{content:'✓';position:absolute;right:3px;top:3px;background:var(--coral);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:.7rem}.person small{display:none}.actions{text-align:center;padding:0 20px 24px}.primary{background:var(--coral);color:#fff8df;padding:13px 22px;box-shadow:0 4px #a84438}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.hidden{display:none!important}.hud{display:flex;gap:10px;padding:12px;background:#f1dfa8;border-bottom:4px solid var(--ink);flex-wrap:wrap}.stat{background:#fff8e7;border:2px solid var(--ink);border-radius:12px;padding:7px 12px;min-width:110px}.stat label{display:block;font-size:.65rem;font-weight:900;text-transform:uppercase;opacity:.6}.stat strong{font-size:1.45rem}.timer{color:var(--coral)}.game{padding:15px;background:#e5d6a7}.forest{position:relative;aspect-ratio:1.333;background:url('../assets/escenario-pinar-ilustrado.png') center/cover;border:4px solid var(--ink);border-radius:17px;overflow:hidden}.hole{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;cursor:pointer;overflow:hidden}.h1{left:28%;top:64%;width:10%;height:8%}.h2{left:72%;top:62%;width:10%;height:8%}.h3{left:17%;top:83%;width:17%;height:14%}.h4{left:55%;top:87%;width:19%;height:16%}.h5{left:84%;top:82%;width:17%;height:14%}.mole{position:absolute;left:50%;bottom:-95%;transform:translateX(-50%);width:76%;height:160%;border-radius:50%;background:#c78150;transition:transform .28s cubic-bezier(.2,.85,.3,1),opacity .18s;overflow:hidden;box-shadow:0 5px 0 #633b2b;z-index:2;visibility:hidden;opacity:0}.mole img{width:100%;height:100%;object-fit:cover;object-position:center top;clip-path:ellipse(47% 43% at 50% 42%)}.hole.up .mole{transform:translate(-50%,42%);visibility:visible;opacity:1}.hole.hit .mole{animation:bonk .23s}.float{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);font-size:1.6rem;font-weight:1000;opacity:0;z-index:5}.hole.hit .float{animation:float .65s}.legend{text-align:center;font-size:.8rem;font-weight:800;opacity:.65;padding:9px}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#16382dbb;z-index:9}.result{background:var(--cream);border:4px solid var(--ink);border-radius:20px;text-align:center;padding:24px;max-width:330px}.result h2{margin:0}.big{font-size:4rem;color:var(--coral);font-weight:1000;line-height:1}.chosen{display:flex;justify-content:center;gap:8px;margin:12px 0}.chosen img{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid var(--ink)}@keyframes bonk{50%{transform:translate(-50%,45%) rotate(-10deg)}}@keyframes float{0%{opacity:0;transform:translate(-50%,0)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-45px)}}@media(max-width:700px){.gallery{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding-inline:9px}.stat{flex:1;min-width:80px}.forest{aspect-ratio:1/1.05}.h1{left:28%;top:61%;width:10%;height:7%}.h2{left:72%;top:59%;width:10%;height:7%}.h3{left:17%;top:79%;width:17%;height:13%}.h4{left:55%;top:84%;width:19%;height:14%}.h5{left:84%;top:78%;width:17%;height:12%}}
</style></head><body><main class="page"><div class="shell"><header class="brand"><div style="font-size:42px">🔨</div><div><b>Topos de<br>Puente Almuhey</b><br><span>¿Quién es la madre del topo?</span></div></header>
<section class="card" id="selection"><div class="intro"><h2>Escoge 3 caras</h2><p>El juego asignará sus roles y puntuaciones al azar.</p></div><div class="gallery" id="gallery"></div><div class="actions"><button class="primary" id="go" disabled>Selecciona 3 personajes</button></div></section>
<section class="card hidden" id="play"><div class="hud"><div class="stat"><label>Puntos</label><strong id="score">0</strong></div><div class="stat"><label>Racha</label><strong id="streak">0 🔥</strong></div><div class="stat"><label>Tiempo</label><strong class="timer" id="time">30</strong></div><div class="stat"><label>Roles ocultos</label><strong>3</strong></div></div><div class="game"><div class="forest" id="forest"><div class="hole h1"></div><div class="hole h2"></div><div class="hole h3"></div><div class="hole h4"></div><div class="hole h5"></div><div class="modal hidden" id="modal"><div class="result"><h2>¡Partida terminada!</h2><div class="big" id="final">0</div><b>puntos</b><div class="chosen" id="chosen"></div><button class="primary" id="restart">Elegir otras caras</button></div></div></div><div class="legend">Golpea a los topos cuando asomen. Sus roles y valores son secretos.</div></div></section></div></main>
<script>document.head.insertAdjacentHTML('beforeend','<link rel="stylesheet" href="fix-topos.css">');const gameFix=document.createElement('script');gameFix.src='fix-game.js';document.head.appendChild(gameFix);
const gallery=document.querySelector('#gallery'),go=document.querySelector('#go'),selection=document.querySelector('#selection'),play=document.querySelector('#play'),modal=document.querySelector('#modal');let selected=[],roles=[],score=0,streak=0,time=30,playing=false,timer,spawn,activeHole;
const faces=['cara-01-01','cara-01-02','cara-01-03','cara-01-06','cara-02-02','cara-02-03','cara-02-04','cara-02-05','cara-02-06','cara-03-01','cara-03-02','cara-04-01','cara-04-02','cara-04-03'].map(n=>'../assets/caras/'+n+'.png');faces.forEach((src,i)=>{const el=document.createElement('button');el.className='person';el.innerHTML='<img src="'+src+'"><small>'+(i+1)+'</small>';el.onclick=()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i);el.classList.toggle('selected');go.disabled=selected.length!==3;go.textContent=selected.length===3?'Comenzar partida':'Selecciona '+(3-selected.length)+' más'};gallery.appendChild(el)});
function shuffle(a){return a.sort(()=>Math.random()-.5)}function update(){document.querySelector('#score').textContent=score;document.querySelector('#streak').textContent=streak+' 🔥';document.querySelector('#time').textContent=time}
function start(){clearInterval(timer);clearTimeout(spawn);roles=shuffle([{v:10},{v:25},{v:-15}]);selection.classList.add('hidden');play.classList.remove('hidden');modal.classList.add('hidden');score=0;streak=0;time=30;playing=true;update();pop();timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}
const topoFaces=Array.from({length:14},(_,i)=>'../assets/topos/topo-'+String(i+1).padStart(2,'0')+'.png');
function pop(){if(!playing)return;document.querySelectorAll('.hole').forEach(h=>h.classList.remove('up'));activeHole=document.querySelectorAll('.hole')[Math.floor(Math.random()*3)];const role=roles[Math.floor(Math.random()*3)],face=selected[Math.floor(Math.random()*3)],m=document.createElement('div');m.className='mole';m.innerHTML='<img src="'+topoFaces[face]+'">';activeHole.querySelectorAll('.mole').forEach(x=>x.remove());activeHole.append(m);activeHole.dataset.value=role.v;activeHole.classList.add('up');setTimeout(()=>activeHole.classList.remove('up'),2000);spawn=setTimeout(pop,4000)}
document.querySelectorAll('.hole').forEach(h=>h.onclick=()=>{if(!playing||!h.classList.contains('up')){if(playing)streak=0;update();return}const v=+h.dataset.value;score+=v;streak=v>0?streak+1:0;h.classList.add('hit');const f=document.createElement('div');f.className='float';f.textContent=(v>0?'+':'')+v;h.append(f);setTimeout(()=>{h.classList.remove('hit');f.remove()},650);h.classList.remove('up');update()});
function end(){playing=false;clearInterval(timer);clearTimeout(spawn);document.querySelectorAll('.hole').forEach(h=>h.classList.remove('up'));document.querySelector('#final').textContent=score;document.querySelector('#chosen').innerHTML=selected.map(i=>'<img src="'+faces[i]+'">').join('');modal.classList.remove('hidden')}
go.onclick=start;document.querySelector('#restart').onclick=()=>{modal.classList.add('hidden');play.classList.add('hidden');selection.classList.remove('hidden');selected=[];document.querySelectorAll('.person').forEach(x=>x.classList.remove('selected'));go.disabled=true;go.textContent='Selecciona 3 personajes'};document.querySelector('.h4')?.remove();document.querySelector('.h5')?.remove();update();
</script></body></html>
